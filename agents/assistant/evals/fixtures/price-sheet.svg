<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <!-- An obviously fake price sheet for the evals. The last price is smudged on purpose. -->
  <defs>
    <filter id="smudge" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1000" height="760" fill="#fbfaf6"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#1d1d1d">
    <text x="70" y="110" font-size="46" font-weight="bold">Sample Price List</text>
    <text x="70" y="165" font-size="28" fill="#555">All visits: $150 minimum</text>
    <line x1="70" y1="200" x2="930" y2="200" stroke="#999" stroke-width="2"/>
    <g font-size="36">
      <text x="70" y="285">Widget service</text>
      <text x="930" y="285" text-anchor="end">$12 each</text>
      <text x="70" y="385">Gadget fitting</text>
      <text x="930" y="385" text-anchor="end">$2 each</text>
      <text x="70" y="485">Sprocket check</text>
      <text x="930" y="485" text-anchor="end">$45 per hour</text>
      <text x="70" y="585">Doohickey polish</text>
      <text x="930" y="585" text-anchor="end">each</text>
    </g>
  </g>
  <!-- The smudge: an ink blot over the last price, blurred so the digits can't be read. -->
  <ellipse cx="800" cy="572" rx="70" ry="34" fill="#3a352c" filter="url(#smudge)"/>
  <ellipse cx="790" cy="572" rx="52" ry="26" fill="#2b2720"/>
</svg>
